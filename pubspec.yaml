name: hobby_app
description: A personal reading companion app for tracking books, sessions, quotes, and ratings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.1
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.3.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  shared_preferences: ^2.3.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
